<path d="M72 53L80 60L72 67" stroke="#f0c75e" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
<path d="M84 71H96" stroke="#f0c75e" stroke-width="5" stroke-linecap="round" fill="none"/>
</g>
<text x="400" y="218" text-anchor="middle" font-family="DejaVu Serif" font-weight="bold" font-size="42" fill="#e4ebe8">Su<tspan fill="#5cc3ae">linux</tspan></text>
</svg>
