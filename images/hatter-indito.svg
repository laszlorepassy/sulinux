<stop offset="0" stop-color="#16201c"/><stop offset="1" stop-color="#0d1311"/>
</radialGradient>
<pattern id="kockas" width="20" height="20" patternUnits="userSpaceOnUse">
<path d="M20 0H0V20" fill="none" stroke="#1b2622" stroke-width="1"/>
</pattern>
</defs>
<rect width="800" height="600" fill="url(#alap)"/>
<rect width="800" height="600" fill="url(#kockas)"/>
<g transform="translate(328 39) scale(1.2)">
<path d="M57 36C45 28 29 26 14 30V94C29 90 45 92 57 100Z" fill="#5cc3ae"/>
<path d="M63 36C75 28 91 26 106 30V94C91 90 75 92 63 100Z" fill="#5cc3ae"/>
