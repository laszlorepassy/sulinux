<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
<!-- A pendrive indítómenüjének háttere (a táblás háttérkép 4:3-as változata). A live-build
     800x600-as (GRUB, UEFI) és 640x480-as (syslinux, BIOS) képet készít belőle, és a saját
     menüjét rajzolja rá; a menü a kép alsó felébe kerül, ezért a logó a felső harmadban van. -->
<defs>
