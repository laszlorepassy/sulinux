# Sulinux: a Debian calamares-settings-debian users.conf-ja, egy kiegészítéssel: a szótári
# (gyenge) jelszó sem tiltott végleg, a telepítő egy jelölőnégyzettel engedi meg (iskolai
# gépeken gyakori az egyszerű, közös jelszó).
---
userGroup:       users
defaultGroups:
    - cdrom
    - floppy
    - sudo
    - audio
    - dip
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

passwordRequirements:
    nonempty: true
    minLength: -1  # Password at least this many characters
    maxLength: -1  # Password at most this many characters
    libpwquality:
        - minlen=0
        - minclass=0

# Gyenge jelszó engedélyezése jelölőnégyzettel (alapból nincs bejelölve)
allowWeakPasswords: true
allowWeakPasswordsDefault: false
