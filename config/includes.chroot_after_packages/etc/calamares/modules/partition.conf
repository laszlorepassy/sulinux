# Sulinux: automatikus partícionálás Btrfs fájlrendszerrel
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 512MiB
    minimumSize: 32MiB
    label: "EFI"

# Memóriacserét a zram ad (tömörített RAM), így alapból nem kell swap-partíció.
userSwapChoices:
    - none      # nincs swap (ajánlott, a zram elég)
    - small     # kis swap-partíció
    - suspend   # hibernáláshoz elég nagy swap-partíció
initialSwapChoice: none

drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none

defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4", "xfs"]
